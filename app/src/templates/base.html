<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}CineTrack{% endblock %}</title>

  <!-- Bootstrap 5.3 CDN -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />
  <!-- Font Awesome 6 CDN -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6Q=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />

  <style>
    body { background-color: #f8f9fa; }
    .star-filled { color: #f5c518; }
    .star-empty  { color: #ccc; }
    .card { transition: box-shadow .15s; }
    .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.12); }
  </style>

  {% block extra_head %}{% endblock %}
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-md navbar-dark bg-dark shadow-sm mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold" href="{% url 'title-list' %}">
        <i class="fa-solid fa-clapperboard me-2"></i>CineTrack
      </a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarMain"
        aria-controls="navbarMain"
        aria-expanded="false"
        aria-label="Abrir menú de navegación"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarMain">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="{% url 'title-list' %}">
              <i class="fa-solid fa-list me-1"></i>Mi lista
            </a>
          </li>
          <li class="nav-item">
            <a class="btn btn-warning ms-md-3 mt-2 mt-md-0" href="{% url 'title-create' %}">
              <i class="fa-solid fa-plus me-1"></i>Añadir
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Mensajes flash -->
  {% if messages %}
    <div class="container mb-3">
      {% for message in messages %}
        <div
          class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show"
          role="alert"
        >
          {{ message }}
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="alert"
            aria-label="Cerrar mensaje"
          ></button>
        </div>
      {% endfor %}
    </div>
  {% endif %}

  <!-- Contenido principal -->
  <main class="container pb-5">
    {% block content %}{% endblock %}
  </main>

  <!-- Bootstrap JS -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmvFNQsXAHHXQXqFNcBDKBcUqbHh"
    crossorigin="anonymous"
  ></script>

  {% block extra_js %}{% endblock %}
</body>
</html>
